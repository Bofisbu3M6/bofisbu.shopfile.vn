<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bofisbu - Shop File Uy Tín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <nav class="p-4 flex justify-between items-center sticky top-0 bg-[#0f172a]/90 backdrop-blur-md z-50">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-slate-800 rounded-2xl flex items-center justify-center text-2xl shadow-lg border border-slate-700">🔥</div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase">bofisbu</h1>
                <p class="text-[10px] text-gray-400 font-bold">ID: 888999</p>
            </div>
        </div>
        <div class="bg-slate-800/50 border border-slate-700 px-4 py-1.5 rounded-2xl text-right">
            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider">Số dư</p>
            <p class="text-orange-500 font-black text-sm">500.000đ</p>
        </div>
    </nav>

    <div class="px-4">
        <div class="w-full bg-gradient-to-br from-orange-600 to-red-700 p-6 rounded-[2rem] shadow-2xl mb-6 relative overflow-hidden border-b-4 border-orange-800">
            <div class="relative z-10">
                <h2 class="text-2xl font-black italic tracking-tighter">BOFISBU.SHOP</h2>
                <p class="text-xs font-bold opacity-90 uppercase">Hệ thống File Data - Menu VIP</p>
            </div>
            <div class="absolute -right-4 -bottom-4 text-8xl opacity-10 font-black">MOD</div>
        </div>

        <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar py-1">
            <button class="bg-orange-600 px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest shadow-lg shadow-orange-600/30">Tất cả</button>
            <button class="bg-slate-800 border border-slate-700 px-6 py-2.5 rounded-full text-xs font-bold text-gray-400 uppercase tracking-widest">Aimlock</button>
            <button class="bg-slate-800 border border-slate-700 px-6 py-2.5 rounded-full text-xs font-bold text-gray-400 uppercase tracking-widest">Panel</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800/40 border border-slate-700/50 p-3 rounded-[2rem] shadow-xl">
                <div class="w-full aspect-square bg-slate-900 rounded-[1.5rem] mb-3 flex items-center justify-center text-4xl border border-slate-700/30">🎯</div>
                <span class="text-[9px] bg-orange-600/20 text-orange-500 px-2 py-0.5 rounded-full font-black uppercase mb-1 inline-block">Hot</span>
                <h3 class="font-black text-sm mb-2 truncate uppercase">Aimlock VIP OB44</h3>
                <p class="text-green-400 font-black text-sm mb-3">20.000đ</p>
                <button class="w-full bg-orange-600 py-3 rounded-2xl text-[10px] font-black uppercase tracking-tighter active:scale-95 transition-all shadow-lg shadow-orange-900/20">Mua Ngay</button>
            </div>

            <div class="bg-slate-800/40 border border-slate-700/50 p-3 rounded-[2rem] shadow-xl">
                <div class="w-full aspect-square bg-slate-900 rounded-[1.5rem] mb-3 flex items-center justify-center text-4xl border border-slate-700/30">🛠️</div>
                <span class="text-[9px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded-full font-black uppercase mb-1 inline-block">New</span>
                <h3 class="font-black text-sm mb-2 truncate uppercase">Panel Antiban</h3>
                <p class="text-green-400 font-black text-sm mb-3">50.000đ</p>
                <button class="w-full bg-orange-600 py-3 rounded-2xl text-[10px] font-black uppercase tracking-tighter active:scale-95 transition-all shadow-lg shadow-orange-900/20">Mua Ngay</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-4 right-4 bg-slate-900/80 backdrop-blur-2xl border border-white/10 h-20 rounded-[2.5rem] flex justify-around items-center px-4 shadow-2xl z-50">
        <button class="text-orange-500 flex flex-col items-center gap-1">
            <span class="text-xl">🏠</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Shop</span>
        </button>
        <button class="text-gray-500 flex flex-col items-center gap-1">
            <span class="text-xl">💳</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Nạp tiền</span>
        </button>
        <button class="text-gray-500 flex flex-col items-center gap-1">
            <span class="text-xl">👤</span>
            <span class="text-[9px] font-black uppercase tracking-tighter">Tài khoản</span>
        </button>
    </div>

</body>
</html>
